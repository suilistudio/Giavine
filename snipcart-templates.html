<div id="snipcart-templates">

  <overridable name="item-line">

    <li
      :class="{
        'snipcart-item-line': true,
        'snipcart-item-line--cart-edit': editingCart
      }"
    >
      <div class="custom-item-line">

        <div class="custom-item-line__image">
          <item-image></item-image>
        </div>

        <div class="custom-item-line__details">

          <div class="custom-item-line__name">
            {{ item.name }}
          </div>

          <div
            v-if="item.metadata && item.metadata.subheader"
            class="custom-item-line__subheader"
          >
            {{ item.metadata.subheader }}
          </div>

          <div
            v-if="item.customFields && item.customFields.length"
            class="custom-item-line__attributes"
          >
            <div
              v-for="field in item.customFields"
              :key="field.name"
              class="custom-item-line__attribute"
            >
              <span class="custom-item-line__attribute-name">
                {{ field.name }}:
              </span>

              <span>
                {{ field.value }}
              </span>
            </div>
          </div>

        </div>

        <div class="custom-item-line__actions">

          <div class="custom-item-line__price">
            {{ item.unitPrice | money(cart.currency) }}
          </div>

          <div class="custom-item-line__controls">
            <item-quantity></item-quantity>

            <remove-item-action class="custom-item-line__remove">
              <icon name="trash"></icon>
            </remove-item-action>
          </div>

        </div>

      </div>
    </li>

  </overridable>

  <style>
    .custom-item-line {
      box-sizing: border-box;
      width: 100%;

      display: grid;
      grid-template-columns: 80px minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;

      padding: 18px 0;
      border-bottom: 1px solid #e5e5e5;
    }

    .custom-item-line__image {
      width: 80px;
      height: 100px;
      overflow: hidden;
    }

    .custom-item-line__image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .custom-item-line__details {
      min-width: 0;
    }

    .custom-item-line__name {
      margin-bottom: 5px;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
    }

    .custom-item-line__subheader {
      margin-bottom: 8px;
      font-size: 14px;
      line-height: 1.4;
      opacity: 0.65;
    }

    .custom-item-line__attributes {
      display: flex;
      flex-direction: column;
      gap: 3px;

      font-size: 13px;
      line-height: 1.4;
    }

    .custom-item-line__attribute-name {
      font-weight: 500;
    }

    .custom-item-line__actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
    }

    .custom-item-line__price {
      white-space: nowrap;
      font-size: 15px;
      font-weight: 600;
    }

    .custom-item-line__controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .custom-item-line__remove {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 32px;
      height: 32px;
      cursor: pointer;
    }

    .custom-item-line__remove .snipcart__icon {
      width: 18px;
      height: 18px;
    }

    /*
     * Important:
     * Remove Snipcart's padding/container sizing from the
     * outer line and let our wrapper control it.
     */
    #snipcart .snipcart-item-line:has(.custom-item-line) {
      padding: 0;
      width: 100%;
    }

    /*
     * Side cart gets narrow quickly, so collapse sooner
     * than the normal page breakpoint.
     */
    @media (max-width: 700px) {
      .custom-item-line {
        grid-template-columns: 70px minmax(0, 1fr);
        gap: 12px;
      }

      .custom-item-line__image {
        width: 70px;
        height: 90px;
      }

      .custom-item-line__actions {
        grid-column: 2;

        width: 100%;

        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }
  </style>

</div>
