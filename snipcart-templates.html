<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    /* =========================
       CUSTOM SNIPCART ITEM
       ========================= */

    #snipcart .custom-item-line {
      box-sizing: border-box;
      width: 100%;

      display: grid;
      grid-template-columns: 80px minmax(0, 1fr);
      column-gap: 16px;
      row-gap: 12px;
      align-items: start;

      padding: 20px 0;
      border-bottom: 1px solid #e5e5e5;
    }

    /* IMAGE */

    #snipcart .custom-item-line__image {
      width: 80px;
      height: 100px;
      overflow: hidden;
    }

    #snipcart .custom-item-line__image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* DETAILS */

    #snipcart .custom-item-line__details {
      min-width: 0;
    }

    #snipcart .custom-item-line__name {
      margin: 0 0 5px;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
    }

    #snipcart .custom-item-line__subheader {
      margin-bottom: 8px;
      font-size: 14px;
      line-height: 1.4;
      opacity: 0.65;
    }

    #snipcart .custom-item-line__attributes {
      display: flex;
      flex-direction: column;
      gap: 3px;

      font-size: 13px;
      line-height: 1.4;
    }

    #snipcart .custom-item-line__attribute-name {
      font-weight: 600;
    }

    /* PRICE + QUANTITY + REMOVE */

    #snipcart .custom-item-line__actions {
      grid-column: 2;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      width: 100%;
    }

    #snipcart .custom-item-line__price {
      flex-shrink: 0;
      white-space: nowrap;

      font-size: 15px;
      font-weight: 600;
    }

    #snipcart .custom-item-line__controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #snipcart .custom-item-line__remove {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 32px;
      height: 32px;

      cursor: pointer;
    }

    #snipcart .custom-item-line__remove .snipcart__icon {
      width: 18px;
      height: 18px;
    }

    /* Remove some default item-line spacing */

    #snipcart .snipcart-item-line.custom-item-line-wrapper {
      box-sizing: border-box;
      width: 100%;
      padding: 0;
    }
  </style>
</head>

<body>

  <div id="snipcart-templates">

    <item-line>
      <li
        class="snipcart-item-line custom-item-line-wrapper"
      >
        <div class="custom-item-line">

          <!-- PRODUCT IMAGE -->
          <div class="custom-item-line__image">
            <item-image></item-image>
          </div>


          <!-- PRODUCT INFORMATION -->
          <div class="custom-item-line__details">

            <div class="custom-item-line__name">
              {{ item.name }}
            </div>

            <!-- Subheader from metadata -->
            <div
              v-if="item.metadata && item.metadata.subheader"
              class="custom-item-line__subheader"
            >
              {{ item.metadata.subheader }}
            </div>


            <!-- Custom fields -->
            <div
              v-if="item.customFields && item.customFields.length"
              class="custom-item-line__attributes"
            >
              <div
                v-for="field in item.customFields"
                :key="field.name"
                class="custom-item-line__attribute"
              >
                <span class="custom-item-line__attribute-name">
                  {{ field.name }}:
                </span>

                <span>
                  {{ field.value }}
                </span>
              </div>
            </div>

          </div>


          <!-- PRICE / QUANTITY / REMOVE -->
          <div class="custom-item-line__actions">

            <div class="custom-item-line__price">
              {{ item.unitPrice | money(cart.currency) }}
            </div>

            <div class="custom-item-line__controls">

              <item-quantity></item-quantity>

              <remove-item-action class="custom-item-line__remove">
                <icon name="trash"></icon>
              </remove-item-action>

            </div>

          </div>

        </div>
      </li>
    </item-line>

  </div>

</body>
</html>
